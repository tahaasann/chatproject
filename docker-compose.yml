services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dreamai
      POSTGRES_PASSWORD: dreamai
      POSTGRES_DB: dreamai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://api:3001
    depends_on:
      - api

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: http://app:5173
    ports:
      - "3000:3000"
    depends_on:
      - app

volumes:
  postgres_data: